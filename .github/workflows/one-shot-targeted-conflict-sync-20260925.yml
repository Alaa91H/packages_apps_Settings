name: One-shot targeted conflict sync

on:
  push:
    paths:
      - '.github/workflows/one-shot-targeted-conflict-sync-20260925.yml'

permissions:
  contents: write

jobs:
  targeted-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve only conflicted branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_PATH: .github/workflows/one-shot-targeted-conflict-sync-20260925.yml
        shell: bash
        run: |
          set -u
          workflow_sha="$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH" --jq '.sha')"
          gh api --method DELETE "repos/$REPO/contents/$WORKFLOW_PATH" \
            -f message='chore: remove targeted conflict-sync workflow [skip ci]' \
            -f sha="$workflow_sha" -f branch="$DEFAULT_BRANCH" >/dev/null

          gh auth setup-git
          git clone --filter=blob:none --no-checkout --single-branch --branch "$DEFAULT_BRANCH" "https://github.com/$REPO.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          total=0; synced=0; failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            total=$((total + 1))
            echo "::group::Resolve $branch"
            git fetch --filter=blob:none origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git reset --hard >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
            git checkout -B sync-work "origin/$branch"
            if git merge --no-edit -X ours "origin/$DEFAULT_BRANCH"; then
              :
            else
              mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
              for p in "${conflicts[@]}"; do
                if git checkout --ours -- "$p" 2>/dev/null; then git add -- "$p"; else git rm -f --ignore-unmatch -- "$p" >/dev/null 2>&1 || true; fi
              done
              if git diff --name-only --diff-filter=U | grep -q .; then
                failed=$((failed + 1)); git merge --abort >/dev/null 2>&1 || true; echo "::endgroup::"; continue
              fi
              git commit --no-edit || git commit -m "chore: sync $branch with $DEFAULT_BRANCH (preserve branch conflicts)"
            fi
            if git push origin "HEAD:refs/heads/$branch"; then synced=$((synced + 1)); else failed=$((failed + 1)); fi
            echo "::endgroup::"
          done <<'BRANCHES'
          arabic-localization-20260922
          BRANCHES
          echo "TARGET_TOTAL=$total"
          echo "TARGET_SUCCESS=$synced"
          echo "TARGET_FAILED=$failed"